<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kafel Ventas</title>
<meta name="description" content="Panel de ventas para coordinadores y vendedores de Kafel.">
<meta name="theme-color" content="#2563EB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --fg:#0F172A; --muted:#475569; --line:#E2E8F0;
  --primary:#2563EB; --primary-d:#1D4ED8; --primary-soft:#EFF6FF;
  --ok:#047857; --ok-soft:#ECFDF5; --warn:#B45309; --warn-soft:#FEF3C7;
  --bad:#B91C1C; --bad-soft:#FEE2E2; --ink:#0F172A;
  --r:12px; --nav-h:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.small{font-size:.875rem}.tiny{font-size:.8rem}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
.right{text-align:right}.mt{margin-top:16px}.mt2{margin-top:8px}.b{font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:var(--primary-d)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--fg);border-color:var(--line)}.btn.sec:hover{background:var(--bg)}
.btn.ok{background:var(--ok)}.btn.ok:hover{background:#065F46}
.btn.bad{background:#fff;color:var(--bad);border-color:#FECACA}.btn.bad:hover{background:var(--bad-soft)}
.btn.sm{min-height:44px;padding:0 12px;font-size:.9rem}
.btn.block{width:100%}
.linkbtn{background:none;border:0;color:var(--primary);font-weight:600;cursor:pointer;padding:10px 4px;min-height:44px}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}

/* Formularios */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
.in{width:100%;min-height:46px;padding:10px 12px;border:1px solid #CBD5E1;border-radius:10px;background:#fff;font-weight:400}
textarea.in{min-height:88px;resize:vertical}
.in:focus{border-color:var(--primary)}
.err{color:var(--bad);font-size:.85rem;font-weight:500;min-height:0}
.hint{color:var(--muted);font-size:.82rem;font-weight:400}
.formerr{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:.92rem}
.formok{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:10px;font-size:.92rem}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.chk input{width:22px;height:22px;margin-top:1px;flex:none}

/* Tarjetas y listas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tight{padding:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2d{grid-template-columns:1fr 1fr}}
.stat{display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;min-height:112px;transition:border-color .15s}
.stat:hover{border-color:var(--primary)}
.stat .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;font-weight:600}
.stat .val{font-size:1.5rem;font-weight:700;line-height:1.2}
.stat .sub{font-size:.82rem;color:var(--muted)}
.hero{background:var(--primary);color:#fff;border-radius:var(--r);padding:18px}
.hero .big{font-size:2rem;font-weight:700;line-height:1.2}
.hero .sub{opacity:.92;font-size:.9rem}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:#fff;border-radius:99px}
.bar.d{background:var(--line)}.bar.d i{background:var(--primary)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--line);color:var(--fg);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.info{background:var(--primary-soft);color:var(--primary-d)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.item:hover{border-color:#94A3B8}
.item.static{cursor:default}.item.static:hover{border-color:var(--line)}
.client{border-left:6px solid var(--ink)}
.client.sold{border-left-color:var(--ok);background:var(--ok-soft)}
.client .nm{font-weight:700;color:var(--ink)}
.client.sold .nm{color:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;position:relative;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.sect{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed #CBD5E1;border-radius:var(--r);background:#fff}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.kv:last-child{border-bottom:0}
.ben{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:.92rem}
.code{font-size:1.6rem;font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.sk{height:84px;border-radius:var(--r);background:linear-gradient(90deg,#E2E8F0,#F1F5F9,#E2E8F0);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:8px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.72rem;color:var(--muted)}
.bars .c i{display:block;width:100%;background:var(--primary);border-radius:6px 6px 0 0;min-height:3px}

/* Chat */
.chat{display:flex;flex-direction:column;height:min(560px,calc(100vh - 290px));min-height:320px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-color:var(--primary)}
.msg .who{font-size:.74rem;font-weight:700;opacity:.8}.msg .t{font-size:.7rem;opacity:.75;text-align:right}
.msg .body{white-space:pre-wrap}

/* Auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px 16px}
.auth .box{width:100%;max-width:440px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.25rem;justify-content:center;margin-bottom:16px}
.logo i{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;font-style:normal}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E2E8F0;border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-selected=true]{background:#fff;color:var(--fg)}

/* Shell */
.shell{min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in-{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
.main{max-width:1100px;margin:0 auto;padding:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;position:relative}
.nav a[aria-current=page]{color:var(--primary)}
.nav .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:99px;background:var(--bad);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 4px}
@media(min-width:900px){
  .shell{padding-bottom:0;padding-left:220px}
  .nav{top:0;bottom:auto;right:auto;width:220px;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:76px 10px 10px;gap:4px}
  .nav a{flex:none;min-height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;border-radius:10px;font-size:.95rem}
  .nav a[aria-current=page]{background:var(--primary-soft)}
  .nav .dot{position:static;margin-left:auto}
  .top{position:sticky}
}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:#fff;color:var(--fg)}
dialog::backdrop{background:rgba(15,23,42,.55)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.dlg-b{padding:16px;overflow-y:auto;max-height:calc(100vh - 110px)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
@media(min-width:900px){#toast{bottom:20px}}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-weight:600;font-size:.92rem}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   CONFIGURACIÓN — la clave "publishable" es pública por diseño; la
   seguridad real la dan las políticas RLS de supabase/schema.sql.
   ===================================================================== */
const SUPABASE_URL = 'https://eabfjlvkbnnpxhfdegmq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7wRrQysUOb0TBIXPFpQ2pQ_rj3q1KLq';
const BUCKET = 'comprobantes';
const COUNTRY_CODE = '57'; // Colombia

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const fmtMoney = n => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(Number(n) || 0);
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const mk = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'); };
const nowKey = () => mk(new Date());
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const monthName = key => { const [y, m] = key.split('-'); return MESES[+m - 1] + ' ' + y; };
const fmtDate = d => d ? new Date(d).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const fmtTime = d => new Date(d).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const digits = s => String(s || '').replace(/\D/g, '');
const waLink = (num, text) => {
  let d = digits(num); if (d.length === 10) d = COUNTRY_CODE + d;
  return `https://wa.me/${d}` + (text ? `?text=${encodeURIComponent(text)}` : '');
};
const parseMoney = v => Number(digits(v)) || 0;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const L = {
  pay: { pendiente: ['Sin comprobante', 'warn'], en_revision: ['En revisión', 'info'], pagado: ['Pagado', 'ok'], rechazado: ['Rechazado', 'bad'], no_aplica: ['Mensualidad', 'neutral'] },
  del: { pendiente: ['Por iniciar', 'warn'], en_desarrollo: ['En desarrollo', 'info'], entregado: ['Entregado', 'ok'] },
  cli: { visitado: 'Visitado', seguimiento: 'En seguimiento', vendido: 'Vendido', descartado: 'Descartado' },
  sub: { activa: ['Activa', 'ok'], pausada: ['Pausada', 'warn'], cancelada: ['Cancelada', 'bad'] },
  rcp: { en_revision: ['En revisión', 'info'], aprobado: ['Aprobado', 'ok'], rechazado: ['Rechazado', 'bad'] },
  act: { llamada: 'Llamada', whatsapp: 'WhatsApp', visita: 'Visita', cotizacion: 'Cotización', seguimiento: 'Seguimiento', otro: 'Otro' },
};
const badge = (map, k) => { const [t, c] = map[k] || [k, 'neutral']; return `<span class="badge ${c}">${esc(t)}</span>`; };

function friendlyError(e) {
  const m = String(e?.message || e || '');
  const map = [
    [/Invalid login credentials/i, 'Correo o contraseña incorrectos.'],
    [/Email not confirmed/i, 'Debes confirmar tu correo antes de entrar. Revisa tu bandeja.'],
    [/User already registered|already been registered/i, 'Ya existe una cuenta con ese correo.'],
    [/Password should be at least/i, 'La contraseña debe tener al menos 8 caracteres.'],
    [/rate limit|too many/i, 'Demasiados intentos. Espera un momento e inténtalo de nuevo.'],
    [/Database error saving new user/i, 'No se pudo crear la cuenta. Revisa el código del grupo y que el nombre de usuario no esté en uso.'],
    [/Failed to fetch|NetworkError|network/i, 'Sin conexión. Revisa tu internet e inténtalo de nuevo.'],
    [/duplicate key|already exists/i, 'Ese dato ya existe.'],
    [/row-level security|permission denied/i, 'No tienes permiso para hacer esto.'],
  ];
  for (const [re, t] of map) if (re.test(m)) return t;
  return m || 'Ocurrió un error inesperado.';
}

function sellerStats(uid, key) {
  const sales = S.sales.filter(s => s.seller_id === uid);
  const inM = sales.filter(s => mk(s.sold_at) === key);
  const unicas = inM.filter(s => s.kind === 'unica');
  const comVentasOk = sum(sales.filter(s => s.kind === 'unica' && s.payment_status === 'pagado' && s.paid_at && mk(s.paid_at) === key), s => s.seller_commission);
  const comVentasPend = sum(unicas.filter(s => s.payment_status !== 'pagado'), s => s.seller_commission);
  const subs = S.subs.filter(x => x.seller_id === uid);
  const activas = subs.filter(x => x.status === 'activa');
  const okSubIds = new Set(S.payments.filter(p => p.subscription_id && p.status === 'aprobado' && String(p.period).slice(0, 7) === key).map(p => p.subscription_id));
  const comSubOk = sum(subs.filter(x => okSubIds.has(x.id)), x => x.seller_monthly_commission);
  const comSubPend = sum(activas.filter(x => !okSubIds.has(x.id) && String(x.started_at).slice(0, 7) <= key), x => x.seller_monthly_commission);
  const cl = S.clients.filter(c => c.seller_id === uid);
  const visitados = cl.filter(c => mk(c.created_at) === key).length;
  const gest = S.activities.filter(a => a.seller_id === uid && mk(a.created_at) === key).length;
  return {
    ventas: inM.length, totalVendido: sum(inM, s => s.sale_price),
    comVentasOk, comVentasPend, comSubOk, comSubPend, activas: activas.length,
    ganado: comVentasOk + comSubOk, porConfirmar: comVentasPend + comSubPend,
    clientes: cl.length, visitados, gestiones: gest, seguimiento: cl.filter(c => c.status === 'seguimiento').length,
    conv: visitados ? Math.round((inM.length / visitados) * 100) : 0,
  };
}
function subPaidFor(subId, key) { return S.payments.find(p => p.subscription_id === subId && String(p.period).slice(0, 7) === key && p.status !== 'rechazado'); }
function priceOf(catId) { return S.prices[catId]; }

async function doRegister(form) {
  const f = new FormData(form); const role = S.ui.authRole;
  const email = String(f.get('email')).trim(), username = String(f.get('username')).trim();
  const whatsapp = digits(f.get('whatsapp')), password = String(f.get('password')), p2 = String(f.get('password2'));
  const code = String(f.get('code') || '').trim();

  if (username.length < 3) return setFormErr(form, 'El nombre de usuario debe tener al menos 3 caracteres.');
  if (whatsapp.length < 7 || whatsapp.length > 15) return setFormErr(form, 'Escribe un número de WhatsApp válido.');
  if (password.length < 8) return setFormErr(form, 'La contraseña debe tener al menos 8 caracteres.');

async function boot(fromLogin = false) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderAuth();
  let prof;
  try { prof = await q(sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle()); }
  catch (e) { renderAuth(); return toast(friendlyError(e), 'bad'); }
  if (!prof) { await sb.auth.signOut(); renderAuth(); return toast('Tu cuenta no tiene perfil. Contacta al administrador.', 'bad'); }
  if (fromLogin && prof.role !== S.ui.authRole) {
    await sb.auth.signOut();
    S.ui.authRole = prof.role;
    renderAuth(); const f = $('form'); if (f) setFormErr(f, `Esa cuenta es de ${prof.role}. Cambiamos a la pestaña correcta, inicia sesión de nuevo.`);
    return;
  }
  S.profile = prof;
  if (prof.status !== 'activo') return renderPending();
  $('#app').innerHTML = `<div class="main"><div class="stack"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>`;
  try { await loadAll(); } catch (e) { toast(friendlyError(e), 'bad'); }

}

function startLive() {

    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => onMessage(p.new))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'group_prices' }, soft)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'payments' }, soft)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sales' }, soft)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'subscriptions' }, soft)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, soft)
    .subscribe();
  S.poll = setInterval(softRefresh, 60000);
}
function stopLive() { clearInterval(S.poll); if (S.channel && sb) { sb.removeChannel(S.channel); } S.channel = null; }

    const { data: { session } } = await sb.auth.getSession(); if (!session) return;
    const prof = await q(sb.from('profiles').select('*').eq('id', S.profile.id).maybeSingle());
    if (prof && prof.status !== 'activo') { S.profile = prof; return renderPending(); }

    ${items.length ? `<section class="card stack" aria-labelledby="calc-t"><div class="row">${ic('calc')}<h2 id="calc-t">Calculadora de cotización</h2></div>

      ${items.map(p => { const m = p.kind === 'mensualidad'; const qn = S.ui.calc[p.id] || 0;
        return `<div class="row between wrap"><span class="grow"><span class="b">${esc(p.name)}</span><br><span class="small muted">${fmtMoney(priceOf(p.id).sale_price)}${m ? '/mes' : ''}</span></span>
        <span class="row"><button class="iconbtn" data-act="calc" data-id="${p.id}" data-d="-1" aria-label="Quitar uno ${esc(p.name)}">−</button><output class="num b" id="q-${p.id}" style="min-width:24px;text-align:center">${qn}</output><button class="iconbtn" data-act="calc" data-id="${p.id}" data-d="1" aria-label="Agregar uno ${esc(p.name)}">+</button></span></div>`; }).join('')}

};
function calcTotals() {
  let once = 0, monthly = 0, comOnce = 0, comMonth = 0; const lines = [];
  for (const p of S.catalog) { const n = S.ui.calc[p.id] || 0; const pr = priceOf(p.id); if (!n || !pr) continue;
    if (p.kind === 'unica') { once += n * pr.sale_price; comOnce += n * pr.seller_commission; lines.push(`• ${n} × ${p.name}: ${fmtMoney(n * pr.sale_price)}`); }
    else { monthly += n * pr.sale_price; comMonth += n * pr.seller_commission; lines.push(`• ${n} × ${p.name}: ${fmtMoney(n * pr.sale_price)} al mes`); } }
  return { once, monthly, comOnce, comMonth, lines };
}
function updateCalc() {
  const o = $('#calc-out'); if (!o) return; const t = calcTotals();
  S.catalog.forEach(p => { const el = $('#q-' + p.id); if (el) el.textContent = S.ui.calc[p.id] || 0; });
  o.innerHTML = t.lines.length ? `<div class="kv"><span>Pago único</span><b class="num">${fmtMoney(t.once)}</b></div><div class="kv"><span>Mensualidad</span><b class="num">${fmtMoney(t.monthly)}</b></div>
    <div class="kv"><span>Primer pago (único + 1.ª mensualidad)</span><b class="num">${fmtMoney(t.once + t.monthly)}</b></div>
    <div class="kv"><span>Tu ganancia estimada</span><b class="num" style="color:var(--ok)">${fmtMoney(t.comOnce)} + ${fmtMoney(t.comMonth)}/mes</b></div>` : '<p class="small muted">Aún no has elegido nada.</p>';
}
function calcText() { const t = calcTotals(); return `Cotización Kafel\n${t.lines.join('\n')}\n\nPago único: ${fmtMoney(t.once)}\nMensualidad: ${fmtMoney(t.monthly)}\nPrimer pago: ${fmtMoney(t.once + t.monthly)}`; }

/* --- chat (ambos roles) --- */
function threadMessages(key) {
  const me = S.profile.id;
  if (key === 'grupo') return S.messages.filter(m => m.recipient_id === null);
  if (isCoord()) return S.messages.filter(m => m.recipient_id !== null && (m.sender_id === key || m.recipient_id === key));
  return S.messages.filter(m => m.recipient_id !== null);
}
function chatBodyHtml() {
  const list = threadMessages(S.ui.thread); const me = S.profile.id;
  return list.length ? list.map(m => `<div class="msg ${m.sender_id === me ? 'me' : ''}"><div class="who">${m.sender_id === me ? 'Tú' : esc(nameOf(m.sender_id))}</div><div class="body">${esc(m.body)}</div><div class="t">${fmtDate(m.created_at)} ${fmtTime(m.created_at)}</div></div>`).join('') : '<div class="empty" style="margin:auto">Aún no hay mensajes. Escribe el primero.</div>';
}
function renderChatBody() { const m = $('.msgs'); if (!m) return; m.innerHTML = chatBodyHtml(); m.scrollTop = m.scrollHeight; markSeen(S.ui.thread); updateNav(); }
function chatView() {
  const coord = isCoord(); let th = S.ui.thread;
  if (!coord && th !== 'grupo') th = S.ui.thread = 'coord';

async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { toast(friendlyError(e), 'bad'); } finally { if (btn) btn.disabled = false; }
}
async function reload(keepModal = false) { await loadAll(); if (!keepModal) closeModal(); renderView(); updateNav(); }

async function uploadReceipt(form) {
  const file = form.file.files[0]; const note = form.note.value.trim(); if (!file) return setFormErr(form, 'Selecciona la foto o el PDF del comprobante.');
  if (!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(file.type)) return setFormErr(form, 'Solo se aceptan imágenes JPG, PNG, WEBP o PDF.');
  let blob = file;
  if (file.type.startsWith('image/') && file.size > 1.2e6) {
    try { const bmp = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)); const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .82)) || file; } catch { blob = file; }
  }
  if (blob.size > 5 * 1024 * 1024) return setFormErr(form, 'El archivo supera 5 MB. Sube uno más liviano.');
  const type = blob.type || file.type; const ext = type === 'application/pdf' ? 'pdf' : type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : 'jpg';
  const path = `${S.profile.group_id}/${S.profile.id}/${crypto.randomUUID()}.${ext}`;
  const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: type, upsert: false }); if (up.error) throw up.error;
  const { error } = await sb.rpc('submit_payment', { p_sale: form.dataset.sale || null, p_subscription: form.dataset.sub || null, p_period: form.dataset.sub ? todayStr().slice(0, 7) + '-01' : null, p_path: path, p_note: note });
  if (error) { await sb.storage.from(BUCKET).remove([path]); throw error; }
  toast('Comprobante enviado. Tu coordinador lo revisará.', 'ok'); await reload();
}

  'pay-tab': b => { S.ui.payTab = b.dataset.v; renderView(); },
  'cli-filter': b => { S.ui.clientFilter = b.dataset.v; renderView(); },
  'seller-clients': b => { S.ui.clientSeller = b.dataset.id; S.ui.clientFilter = 'todos'; go('clientes'); },
  thread: b => { S.ui.thread = b.dataset.v; renderView(); },
  client: b => openClient(b.dataset.id),
  'new-client': () => openModal('Nuevo cliente', clientForm(null)),
  'edit-client': b => openModal('Editar cliente', clientForm(clientById(b.dataset.id))),
  sell: b => openSell(b.dataset.id),
  upload: b => openModal('Subir comprobante', `<form data-form="receipt" class="stack" ${b.dataset.sale ? `data-sale="${b.dataset.sale}"` : ''} ${b.dataset.sub ? `data-sub="${b.dataset.sub}"` : ''} novalidate>
    <label class="f">Foto o PDF del comprobante<input class="in" type="file" name="file" accept="image/jpeg,image/png,image/webp,application/pdf" required><span class="hint">Máximo 5 MB. Las fotos grandes se reducen solas.</span></label>
    <label class="f">Nota (opcional)<input class="in" name="note" maxlength="200" placeholder="Ej. Nequi, referencia 12345"></label>
    <div class="formerr" role="alert" data-formerr hidden></div><button class="btn block" type="submit">${ic('upload')} Enviar comprobante</button></form>`),
  receipt: async b => { const w = window.open('', '_blank'); try { const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(b.dataset.path, 300); if (error) throw error; if (w) w.location = data.signedUrl; else location.href = data.signedUrl; } catch (e) { if (w) w.close(); toast(friendlyError(e), 'bad'); } },
  review: b => {
    const ok = b.dataset.ok === '1'; const note = ok ? '' : (prompt('Motivo del rechazo (el vendedor lo verá):') ?? null); if (note === null) return;
    return run(b, async () => { const { error } = await sb.rpc('review_payment', { p_payment: b.dataset.id, p_approve: ok, p_note: note }); if (error) throw error; toast(ok ? 'Pago aprobado' : 'Pago rechazado', 'ok'); await reload(); });
  },
  member: b => { if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    return run(b, async () => { const { error } = await sb.rpc('set_member_status', { p_seller: b.dataset.id, p_status: b.dataset.v }); if (error) throw error; toast(b.dataset.v === 'activo' ? 'Vendedor aprobado' : 'Actualizado', 'ok'); await reload(); }); },
  goal: b => { const s = profById(b.dataset.id); openModal('Meta mensual', `<form data-form="goal" data-id="${s.id}" class="stack"><label class="f">Meta de comisión para ${esc(s.username)} (COP)<input class="in" name="amount" inputmode="numeric" value="${Number(s.monthly_goal) || ''}"></label><div class="formerr" role="alert" data-formerr hidden></div><button class="btn block" type="submit">Guardar meta</button></form>`); },
  'save-price': b => { const card = b.closest('[data-price]'); const sale = parseMoney($('[name=sale]', card).value), comm = parseMoney($('[name=comm]', card).value); updateProfitLine(card);
    if ($('[data-o=err]', card).textContent) return;
    return run(b, async () => { const { error } = await sb.from('group_prices').update({ sale_price: sale, seller_commission: comm }).eq('group_id', S.profile.group_id).eq('catalog_id', b.dataset.id); if (error) throw error; toast('Precio guardado. Tus vendedores ya lo ven.', 'ok'); await loadAll(); }); },
  calc: b => { const id = b.dataset.id; S.ui.calc[id] = Math.max(0, Math.min(99, (S.ui.calc[id] || 0) + Number(b.dataset.d))); updateCalc(); },
  'calc-reset': () => { S.ui.calc = {}; updateCalc(); },
  'calc-copy': async () => { const t = calcTotals(); if (!t.lines.length) return toast('Elige al menos un producto.'); try { await navigator.clipboard.writeText(calcText()); toast('Cotización copiada', 'ok'); } catch { toast('No se pudo copiar.', 'bad'); } },
  'calc-wa': () => { const t = calcTotals(); if (!t.lines.length) return toast('Elige al menos un producto.'); window.open(`https://wa.me/?text=${encodeURIComponent(calcText())}`, '_blank', 'noopener'); },
};

const FORMS = {
  login: doLogin, register: doRegister,
  receipt: uploadReceipt,
  client: async form => {
    const f = new FormData(form); const name = String(f.get('name')).trim(); if (name.length < 2) return setFormErr(form, 'Escribe el nombre del cliente.');
    const row = { name, business: String(f.get('business')).trim(), phone: String(f.get('phone')).trim(), city: String(f.get('city')).trim(), notes: String(f.get('notes')).trim(), next_followup: f.get('next_followup') || null };
    const id = form.dataset.id; const { error } = id ? await sb.from('clients').update(row).eq('id', id) : await sb.from('clients').insert(row); if (error) throw error;
    toast(id ? 'Cliente actualizado' : 'Cliente guardado', 'ok'); await reload();
  },
  activity: async form => {
    const f = new FormData(form); const { error } = await sb.from('activities').insert({ client_id: form.dataset.id, type: f.get('type'), note: String(f.get('note')).trim() }); if (error) throw error;
    toast('Gestión registrada', 'ok'); await loadAll(); openClient(form.dataset.id); renderView();
  },
  sale: async form => {
    const f = new FormData(form); const cat = f.get('catalog'); if (!cat) return setFormErr(form, 'Elige un producto.');
    const { data, error } = await sb.rpc('create_sale', { p_client: form.dataset.id, p_catalog: cat, p_notes: String(f.get('notes') || '') }); if (error) throw error;
    toast(`Venta registrada · ticket ${data.ticket}`, 'ok'); await reload();
  },
  goal: async form => { const { error } = await sb.rpc('set_goal', { p_seller: form.dataset.id, p_amount: parseMoney(new FormData(form).get('amount')) }); if (error) throw error; toast('Meta guardada', 'ok'); await reload(); },
  profile: async form => {
    const f = new FormData(form); const username = String(f.get('username')).trim(), whatsapp = digits(f.get('whatsapp'));
    if (username.length < 3) return setFormErr(form, 'El nombre de usuario debe tener al menos 3 caracteres.'); if (whatsapp.length < 7) return setFormErr(form, 'WhatsApp inválido.');
    const { error } = await sb.from('profiles').update({ username, whatsapp }).eq('id', S.profile.id); if (error) throw error; toast('Perfil actualizado', 'ok'); await loadAll(); renderView();
  },
  chat: async form => {
    const body = form.body.value.trim(); if (!body) return; const th = S.ui.thread;
    const recipient = th === 'grupo' ? null : (isCoord() ? th : coordProfile()?.id);
    form.body.value = ''; const { data, error } = await sb.from('messages').insert({ recipient_id: recipient, body }).select().single();
    if (error) { form.body.value = body; throw error; }
    if (!S.messages.some(m => m.id === data.id)) S.messages.push(data); renderChatBody();
  },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.tagName === 'A') return; const r = fn(b, e); if (r && r.catch) r.catch(err => toast(friendlyError(err), 'bad'));
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return; e.preventDefault(); const fn = FORMS[form.dataset.form]; if (!fn) return;
  setFormErr(form, ''); const btn = $('button[type=submit]', form); if (btn?.disabled) return; if (btn) btn.disabled = true;
  Promise.resolve().then(() => fn(form)).catch(err => setFormErr(form, friendlyError(err)) || toast(friendlyError(err), 'bad')).finally(() => { if (btn) btn.disabled = false; });
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return; const k = el.dataset.change;
  if (k === 'cli-seller') { S.ui.clientSeller = el.value; renderView(); }
  else if (k === 'sales-month') { S.ui.salesMonth = el.value; renderView(); }
  else if (k === 'client-status') run(el, async () => { const { error } = await sb.from('clients').update({ status: el.value }).eq('id', el.dataset.id); if (error) throw error; await loadAll(); renderView(); toast('Estado actualizado', 'ok'); });
  else if (k === 'delivery') run(el, async () => { const { error } = await sb.rpc('set_delivery', { p_sale: el.dataset.id, p_status: el.value }); if (error) throw error; await loadAll(); toast('Entrega actualizada', 'ok'); renderView(); });
  else if (k === 'sub-status') run(el, async () => { const { error } = await sb.rpc('set_subscription_status', { p_sub: el.dataset.id, p_status: el.value }); if (error) throw error; await loadAll(); toast('Suscripción actualizada', 'ok'); renderView(); });
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]'); if (!el) return;
  if (el.dataset.input === 'cli-q') { S.ui.clientQ = el.value; const l = $('#clist'); if (l) l.innerHTML = clientListHtml(filteredClients(), isCoord()); }
  else if (el.dataset.input === 'price') updateProfitLine(el.closest('[data-price]'));
  else if (el.name === 'body') { el.style.height = 'auto'; el.style.height = Math.min(120, el.scrollHeight) + 'px'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && e.target.name === 'body' && e.target.closest('[data-form=chat]')) { e.preventDefault(); e.target.closest('form').requestSubmit(); } });

/* ---------- inicio ---------- */
(function start() {
  if (!window.supabase) { $('#app').innerHTML = `<main class="auth"><div class="box card stack"><h1>Sin conexión</h1><p class="muted">No se pudo cargar el sistema. Revisa tu internet y recarga la página.</p><button class="btn" onclick="location.reload()">Recargar</button></div></main>`; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.profile) { S.profile = null; renderAuth(); } });
  boot().catch(e => { renderAuth(); toast(friendlyError(e), 'bad'); });
})();
</script>
</body>
</html>
