<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563EB; --primary-dark:#1D4ED8; --primary-soft:#EAF1FE;
  --accent:#059669; --accent-soft:#E3F6EE; --warn:#B45309; --warn-soft:#FEF3C7;
  --danger:#DC2626; --danger-soft:#FDE8E8;
  --bg:#F8FAFC; --card:#FFFFFF; --fg:#0F172A; --muted:#475569; --muted-bg:#F1F5F9; --border:#DDE5F0;
  --radius:10px; --side:244px;
  --font:'Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Fira Code',ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
.right{text-align:right}

/* botones */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-weight:500;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--muted-bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.green{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green:hover{background:#047857}
.btn.danger{color:var(--danger);border-color:#F5C2C2}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.icon{width:40px;padding:0;justify-content:center}
.btn.sm.icon{width:34px}
.btn:disabled{opacity:.55;cursor:not-allowed}
a.btn{text-decoration:none}

/* formularios */
label.f{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
input,select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.err{background:var(--danger-soft);color:#991B1B;border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:18px}
.brand .logo{width:36px;height:36px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center}
.tabs{display:flex;background:var(--muted-bg);border-radius:9px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;border-radius:6px;min-height:36px;font-weight:500;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--fg);box-shadow:0 0 0 1px var(--border)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.role{border:1.5px solid var(--border);border-radius:10px;padding:12px;text-align:left;background:#fff}
.role.on{border-color:var(--primary);background:var(--primary-soft)}
.role b{display:block} .role span{font-size:12.5px;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border:0;background:transparent;border-radius:8px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--muted-bg);color:var(--fg)}
.nav button.on{background:var(--primary-soft);color:var(--primary-dark)}
.nav .badge{margin-left:auto}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:11.5px;font-weight:600;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
.side .me{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top .grow{flex:1;min-width:0}
.top .burger{display:none}
.content{padding:24px;max-width:1400px}
.pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--muted-bg);color:var(--muted)}
.pill.blue{background:var(--primary-soft);color:var(--primary-dark)}
.pill.green{background:var(--accent-soft);color:#047857}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.red{background:var(--danger-soft);color:#B91C1C}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card>h2{margin-bottom:12px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(176px,1fr));margin-bottom:16px}
.kpi{padding:16px}
.kpi .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--mono);font-weight:600;font-size:22px;margin-top:6px;overflow-wrap:anywhere}
.kpi.g .v{color:#047857} .kpi.b .v{color:var(--primary-dark)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.chartbox{position:relative;height:250px}

/* tablas */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--muted-bg);text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#F8FAFF}
td.num,th.num{text-align:right;font-family:var(--mono)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar>*{width:auto}
.toolbar select,.toolbar input{min-width:150px}
.toolbar .grow{flex:1;min-width:180px}

/* calendario */
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.calhead .ttl{font-weight:600;font-size:16px;min-width:160px}
.calhead .ttl::first-letter{text-transform:uppercase}
.seg{display:inline-flex;background:var(--muted-bg);border-radius:8px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;border-radius:6px;min-height:32px;padding:0 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--fg);box-shadow:0 0 0 1px var(--border)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff}
.cal .dow{background:var(--muted-bg);padding:8px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:center}
.cal .day{min-height:108px;border-top:1px solid var(--border);border-left:1px solid var(--border);padding:4px;display:flex;flex-direction:column;gap:3px;background:#fff;text-align:left;cursor:pointer}
.cal .day:nth-child(7n+8){border-left:0}
.cal .day.out{background:#FAFBFD;color:#94A3B8}
.cal .day .n{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .day.today .n{background:var(--primary);color:#fff}
.cal.week .day{min-height:260px}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:5px;padding:2px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--c,#2563EB);color:var(--t,#fff);border-left:3px solid color-mix(in srgb,var(--c,#2563EB) 70%,#000);font-weight:500}
.chip.venta{background:#B8E26B;color:#23420F;font-weight:700}
.chip.cancelada{text-decoration:line-through;opacity:.6}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c,#2563EB);flex:none;display:inline-block}
.more{font-size:12px;color:var(--muted);padding:0 4px}
.dayview{display:grid;gap:10px}
.appt{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border:1px solid var(--border);border-left:5px solid var(--c,var(--primary));border-radius:var(--radius);background:#fff;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.appt{background:color-mix(in srgb,var(--c,#2563EB) 12%,#fff)}
.appt.venta{background:#EAF7CF}
.appt.cancelada{opacity:.7}
.appt .t{font-family:var(--mono);font-weight:600}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px}
.modal.wide{max-width:680px}
.modal .mh{display:flex;align-items:center;margin-bottom:14px}
.modal .mh h2{flex:1}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:200}
.toast{background:var(--fg);color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;max-width:340px}
.toast.err{background:#B91C1C}
.notif{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;width:100%;text-align:left}
.notif.unread{border-left:4px solid var(--primary);background:#F8FAFF}
.notif+.notif{margin-top:8px}
.code{font-family:var(--mono);font-weight:600;letter-spacing:.06em;background:var(--primary-soft);color:var(--primary-dark);padding:4px 10px;border-radius:7px}
.kpi.click{cursor:pointer;text-align:left;width:100%;display:block;transition:border-color .15s,background .15s}
.kpi.click:hover{border-color:var(--primary);background:#F8FAFF}
.kpi .go{margin-left:auto;color:var(--primary)}
.banner:not(:empty){padding:10px 24px;font-size:14px;display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid #FCD34D}
.hist{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.hist-head,.hist-row{display:grid;grid-template-columns:minmax(110px,1.1fr) 112px 1.8fr 20px;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px}
.hist-head{background:var(--muted-bg);font-size:12.5px;font-weight:600;color:var(--muted)}
.hist-row{border:0;border-top:1px solid var(--border);background:#fff}
.hist-row:hover{background:#F8FAFF}
.hist-row .chev{color:var(--muted)}
.chat{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 150px);min-height:460px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.clist{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.clist .search{padding:10px;border-bottom:1px solid var(--border)}
.clist .items{overflow-y:auto;flex:1}
.citem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:11px 14px;border-bottom:1px solid #EEF2F7}
.citem:hover{background:var(--muted-bg)} .citem.on{background:var(--primary-soft)}
.av{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:600;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:32px;height:32px;font-size:13px} .av.lg{width:84px;height:84px;font-size:28px}
.photo-row{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.grpbox{display:flex;gap:10px;align-items:center;padding:10px;margin:2px 0 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--muted-bg)}
.grpbox .gname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.credit{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:left;padding:18px 24px;margin-top:8px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
.credit .logo-link{flex:none;border-radius:10px;line-height:0;transition:transform .15s}
.credit .logo-link:hover{transform:scale(1.06)}
.credit img{width:46px;height:46px;display:block}
.credit b{color:var(--fg);font-weight:600}
.auth-card .credit{margin-top:18px;padding:16px 0 0}
.av.grp{background:var(--accent)}
.citem .meta{flex:1;min-width:0;display:block}
.citem .nm{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.citem .pv{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.citem .pv .tx{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cpane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#EFEAE2}
.chead{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border)}
.cmsgs{flex:1;overflow-y:auto;padding:14px 5%;display:flex;flex-direction:column;gap:4px}
.day-sep{align-self:center;background:#fff;color:var(--muted);font-size:12px;padding:3px 10px;border-radius:8px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bub{max-width:min(520px,82%);padding:7px 10px 5px;border-radius:9px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.1);overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start}
.bub.me{background:#D9FDD3;align-self:flex-end}
.bub .who{font-size:12.5px;font-weight:600;color:var(--primary-dark)}
.bub .tm{font-size:11px;color:var(--muted);text-align:right;margin-top:2px;white-space:nowrap}
.bub .tick{color:#94A3B8;margin-left:4px} .bub .tick.read{color:#2563EB}
.refc{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--primary);background:rgba(15,23,42,.06);border-radius:6px;padding:6px 8px;margin-bottom:5px;white-space:normal}
.compose{display:flex;gap:8px;padding:10px;background:#F0F2F5;align-items:flex-end}
.compose textarea{min-height:42px;max-height:130px;border-radius:21px;padding:10px 14px;resize:none}
.cempty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.chat .back{display:none}
.scrim{display:none}
.fbar{display:flex;gap:10px;margin-bottom:10px}
.fbar input{flex:1;min-width:0}
.fbar .fbtn{flex:none}
.fbar .fbtn .badge{background:var(--primary)}
.fpanel{margin-bottom:12px;padding:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.fpanel .actions{justify-content:flex-end}
.fchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fchips:empty{display:none}
.fchip{display:inline-flex;gap:6px;align-items:center;border:1px solid #BFD3FA;background:var(--primary-soft);color:var(--primary-dark);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:500}
.fchip svg{width:14px;height:14px}
.lock-info{display:flex;gap:10px;align-items:flex-start;background:var(--muted-bg);color:var(--muted);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.quote-grid{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:16px;align-items:start}
.qsheet{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;font-size:14px}
.qsheet .qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--primary);color:#fff}
.qsheet .qmeta{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--muted);font-size:13px}
.qtable{width:100%;border-collapse:collapse;table-layout:fixed}
.qtable th{width:56%;background:transparent;text-align:left;font-weight:500;color:var(--fg);padding:9px 14px;border-top:1px solid var(--border);font-size:14px;overflow-wrap:anywhere;white-space:normal}
.qtable td{width:44%;padding:9px 14px;border-top:1px solid var(--border);text-align:right;font-family:var(--mono);font-weight:600;overflow-wrap:anywhere}
.qtable tr:first-child th,.qtable tr:first-child td{border-top:0}
.qtable tr.strong th,.qtable tr.strong td{background:var(--primary-soft);color:var(--primary-dark)}
.qtable tr.final th,.qtable tr.final td{background:var(--accent-soft);color:#047857;font-size:16px}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:18px;max-width:640px;margin:0 auto}
  #printArea .qhead{background:#2563EB!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .qtable tr.strong th,#printArea .qtable tr.strong td,#printArea .qtable tr.final th,#printArea .qtable tr.final td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.remind{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13.5px;margin:4px 0 14px}
.note-card{background:var(--warn-soft);border:1px solid #FCD34D;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.del-card{background:var(--danger-soft);border:1px solid #F5C2C2;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.bignum{font-family:var(--mono);font-weight:600;font-size:18px}
.ok{background:var(--accent-soft);color:#065F46;border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.linkbtn{border:0;background:none;color:var(--primary-dark);font-weight:500;padding:0;text-decoration:underline;cursor:pointer;text-align:left}
.btn[aria-disabled=true]{opacity:.75;cursor:not-allowed;pointer-events:none}
.done-banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);color:#065F46;border:1px solid #A7E3CB;border-radius:10px;padding:10px 14px;margin-bottom:12px}
.done-banner .tick-c{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;animation:pop .45s ease-out}
.done-banner .tick-c svg{width:22px;height:22px;stroke-width:3}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.goal{margin-bottom:14px}
.goal .gl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.bar{height:10px;border-radius:999px;background:var(--muted-bg);overflow:hidden}
.bar span{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .4s}
.bar.full span{background:var(--accent)}
.emp-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.swatch{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;padding:0;background:none;cursor:pointer}
input[type=color].swatch{min-height:0;padding:1px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:60;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50}
  .top .burger{display:inline-flex}
  .top{padding:12px 16px} .content{padding:16px}
  .cal .day{min-height:78px}
  .cal .chip{font-size:0;padding:0;height:6px;border-left-width:0;border-radius:3px;background:var(--c,#2563EB)}
  .cal .chip.venta{background:#B8E26B}
  .cal.week{grid-template-columns:1fr}
  .cal.week .dow{display:none}
  .cal.week .day{min-height:0}
  .cal.week .chip{font-size:12.5px;height:auto;padding:3px 6px;border-left-width:3px}
  .row2{grid-template-columns:1fr}
  .quote-grid{grid-template-columns:minmax(0,1fr)}
  .quote-grid>*{min-width:0}
  .seg{margin-left:0}
  .appt{grid-template-columns:56px 1fr}
  .appt>:last-child{grid-column:1/-1}
  .chat{grid-template-columns:1fr;height:calc(100vh - 120px)}
  .chat.open-pane .clist{display:none}
  .chat:not(.open-pane) .cpane{display:none}
  .chat .back{display:inline-flex}
  .hist-head{display:none}
  .hist-row{grid-template-columns:1fr 1fr}
  .hist-row .c3{grid-column:1/-1;order:3}
  .hist-row .chev{display:none}
  .banner:not(:empty){padding:10px 16px}
}
/* =====================================================================
   Versión celular (tipo app). En computador no cambia nada.
   ===================================================================== */
.tabbar,.fab,.qmini,.mobile-only{display:none}
.me-btn{border:0;background:none;padding:0;border-radius:50%;line-height:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 14px}
.more-grid button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:1px solid var(--border);border-radius:14px;background:#fff;font-weight:600;font-size:12.5px;color:var(--fg)}
.more-grid button svg{width:24px;height:24px;color:var(--primary)}
.more-grid .badge{position:absolute;top:6px;right:8px}
.more-user{display:flex;gap:12px;align-items:center;padding:4px 0 14px}

@media (max-width:900px){
  html{-webkit-text-size-adjust:100%}
  body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
  .side,.scrim{display:none!important}
  .top .burger{display:none!important}
  .mobile-only{display:inline-flex}
  .top{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;gap:10px}
  .top h1{font-size:19px}
  .main{padding-bottom:calc(76px + env(safe-area-inset-bottom));animation:fadeUp .25s ease-out}
  .content{padding:14px}
  .banner:not(:empty){padding:9px 14px;font-size:13px}

  /* barra inferior */
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--border);padding:4px 6px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(15,23,42,.07)}
  .tabbar button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border:0;background:none;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600;padding:6px 2px}
  .tabbar button svg{width:23px;height:23px}
  .tabbar button:active{background:var(--muted-bg)}
  .tabbar button.on{color:var(--primary-dark)}
  .tabbar button.on::before{content:'';position:absolute;top:-4px;width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}
  .tabbar .tb-badge{position:absolute;top:3px;left:calc(50% + 6px)}

  /* botones y campos cómodos para el dedo (16 px evita el zoom automático de iPhone) */
  .btn{min-height:46px}
  .btn.sm{min-height:40px}
  .btn.icon.sm{width:40px}
  input,select,textarea{font-size:16px;min-height:46px}
  .nav button{min-height:48px}
  .btn:active{transform:scale(.98)}
  .toolbar select,.toolbar input{min-width:0;flex:1 1 140px}
  .pagehead{gap:10px}
  .desk-only{display:none!important}

  /* resumen */
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi .v{font-size:17px}
  .kpi .l{font-size:12px}
  .cols2{grid-template-columns:1fr}
  .chartbox{height:220px}

  /* ventanas: suben desde abajo como una hoja */
  .ov{align-items:end;padding:0}
  .modal,.modal.wide{max-width:none;width:100%;max-height:92dvh;border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));animation:sheetUp .22s ease-out}
  .modal::before{content:'';display:block;width:44px;height:4px;border-radius:3px;background:#CBD5E1;margin:0 auto 12px}
  .modal .mh{position:sticky;top:-14px;background:#fff;z-index:2;padding:4px 0 8px;margin-bottom:6px}
  .modal form>.mf{position:sticky;bottom:-20px;background:#fff;padding:10px 0 2px}
  .kv{grid-template-columns:110px 1fr}
  .toasts{left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom))}
  .toast{max-width:none}

  /* tablas -> tarjetas */
  .tw{border:0;background:transparent;overflow:visible}
  .tw table,.tw thead,.tw tbody,.tw tr,.tw td{display:block}
  .tw thead{display:none}
  .tw tr{border:1px solid var(--border);border-radius:14px;background:#fff;margin-bottom:10px;padding:4px 14px}
  .tw tr.click:active{background:#F1F5FF}
  .tw td{border:0;padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:right}
  .tw td+td{border-top:1px solid #EEF2F7}
  .tw td::before{content:attr(data-label);color:var(--muted);font-size:12.5px;font-weight:600;text-align:left;flex:none;max-width:44%}
  .tw td[data-label=""]::before{display:none}
  .tw td[data-label=""]{justify-content:flex-end}
  .tw td.num{font-family:var(--mono)}
  .tw td input[type=number]{width:96px}
  .tw td>div{min-width:0}

  /* agenda */
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--primary);color:#fff;box-shadow:0 8px 22px rgba(37,99,235,.45);z-index:35}
  .fab svg{width:26px;height:26px;stroke-width:2.6}
  .fab:active{transform:scale(.94)}
  .calhead .ttl{min-width:0;flex:1}
  .seg{width:100%}
  .seg button{flex:1}
  .cal .day{min-height:64px}

  /* chat a pantalla completa */
  .chat{height:calc(100dvh - 150px);min-height:0;border-radius:14px}
  .chat.open-pane{height:calc(100dvh - 96px)}
  body:has(.chat.open-pane) .tabbar,body:has(.chat.open-pane) .credit{display:none}
  body:has(.chat.open-pane) .main{padding-bottom:0}
  .cmsgs{padding:12px 10px}
  .compose{padding:8px 8px calc(8px + env(safe-area-inset-bottom))}

  /* cotizador: resumen fijo con la cuota */
  .qmini{display:flex;align-items:center;justify-content:space-between;gap:10px;position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:36;background:#fff;border:1px solid #A7E3CB;border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(15,23,42,.16)}
  .qtable th,.qtable td{padding:9px 12px;font-size:13.5px}

  /* con el teclado abierto se esconden las barras para ganar espacio */
  body:has(input:focus,textarea:focus,select:focus) .tabbar,
  body:has(input:focus,textarea:focus,select:focus) .fab,
  body:has(input:focus,textarea:focus,select:focus) .qmini{display:none}

  .credit{padding:14px;text-align:center;justify-content:center}
}
@media (max-width:900px) and (prefers-reduced-motion:reduce){.main,.modal{animation:none}}



/* ===== Kafel Ventas: componentes propios ===== */
.pill.ink{background:var(--fg);color:#fff}
.subtabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--border);scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:0;background:none;min-height:44px;padding:0 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.subtabs button.on{color:var(--primary-dark);border-bottom-color:var(--primary)}
.subtabs .badge{background:var(--danger)}
.tw tr.sold td{background:#F1FBF6}
.tw tr.sold td:first-child{box-shadow:inset 5px 0 0 var(--accent)}
.tw tr.unsold td:first-child{box-shadow:inset 5px 0 0 var(--fg)}
.cname{display:flex;align-items:center;gap:10px;min-width:0}
.cname b{overflow:hidden;text-overflow:ellipsis}
.cname.sold b{color:#047857}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.bcol{background:var(--muted-bg);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.bcol h3{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:2px}
.bcard{display:block;width:100%;text-align:left;border:1px solid var(--border);border-left:5px solid var(--fg);background:#fff;border-radius:9px;padding:10px 12px}
.bcard.sold{border-left-color:var(--accent);background:#F1FBF6}
.bcard:hover{border-color:var(--primary)}
.statrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.statrow:last-child{border-bottom:0}
.statrow b{font-family:var(--mono);font-weight:600}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.warn .v{color:var(--warn)}
.kpi.r .v{color:var(--danger)}
.hero{background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#fff;border-radius:14px;padding:20px;margin-bottom:16px;display:grid;gap:14px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero .big{font-family:var(--mono);font-weight:600;font-size:34px;line-height:1.1;margin:4px 0}
.hero .l{opacity:.9;font-size:13.5px}
.hero .mini{display:flex;gap:18px;flex-wrap:wrap}
.hero .mini div{font-size:12.5px;opacity:.95}
.hero .mini b{display:block;font-family:var(--mono);font-size:16px}
.hero .bar{background:rgba(255,255,255,.28)}
.hero .bar span{background:#fff}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding:16px}.hero .big{font-size:28px}}
.codebox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--primary-soft);border:1px solid #BFD3FA;border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.codebox .code{font-size:22px;letter-spacing:.14em;background:#fff}
.req{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid #FCD34D;background:var(--warn-soft);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.req .grow{flex:1;min-width:160px}
.tickets{display:grid;gap:8px}
.cap{text-transform:capitalize}
.dayhead{font-weight:600;text-transform:capitalize;margin:14px 0 8px}
.chip.seg-seg{background:var(--c);color:var(--t)}
.chip.sale{background:#B8E26B;color:#23420F;font-weight:700}
.chip.done{text-decoration:line-through;opacity:.6}
.appt.sale{background:#EAF7CF}
.pick{display:grid;gap:8px;margin-bottom:12px}
.pick label{display:flex;gap:12px;align-items:center;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.pick label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.pick input{width:20px;height:20px;min-height:0;flex:none}
.pick .grow{flex:1;min-width:0}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper output{min-width:28px;text-align:center;font-family:var(--mono);font-weight:600}
.prod{display:flex;flex-direction:column;gap:10px}
.prod ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.prod .price{font-family:var(--mono);font-weight:600;font-size:22px}
.prod .pc{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.grid.cards3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--primary-soft);color:var(--primary-dark);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.pwd{position:relative}
.pwd button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--primary-dark);font-weight:600;min-height:36px;padding:0 8px}
.pwd input{padding-right:84px}
.rankn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--muted-bg);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.rankn.top{background:#FEF3C7;color:#92400E}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%}
.sticky-bar{position:sticky;bottom:0;background:#fff;padding:10px 0 2px}
.lt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hist-line{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.field-err{color:var(--danger);font-size:13px;margin:-8px 0 10px}
.cal .day .chip{margin-bottom:1px}
.cal .day.has-sale{background:#FBFEF6}
@media print{.qsheet{border:0}}
@media(max-width:900px){
  .hero .mini{gap:12px}
  .board{grid-template-columns:repeat(4,78vw)}
  .subtabs{margin-left:-14px;margin-right:-14px;padding:0 10px}
  .codebox .code{font-size:19px}
}
@media(max-width:900px){.appt{grid-template-columns:62px 1fr auto}.appt>:last-child{grid-column:auto}}

function friendlyError(e) {

    [/Email not confirmed/i, 'Debes confirmar tu correo antes de entrar. Revisa tu bandeja.'],
    [/User already registered|already been registered/i, 'Ya existe una cuenta con ese correo.'],
    [/Password should be at least/i, 'La contraseña debe tener al menos 8 caracteres.'],
    [/different from the old|same as the old/i, 'La contraseña nueva debe ser distinta a la anterior.'],

    [/Database error saving new user/i, 'No se pudo crear la cuenta. Revisa el código del grupo y que el nombre de usuario no esté en uso.'],
    [/Failed to fetch|NetworkError|Load failed/i, 'Sin conexión. Revisa tu internet e inténtalo de nuevo.'],
    [/row-level security|permission denied/i, 'No tienes permiso para hacer esto.'],
    [/Payload too large|exceeded the maximum/i, 'El archivo es demasiado grande (máximo 5 MB).'],
    [/mime type/i, 'Tipo de archivo no permitido. Usa JPG, PNG, WEBP o PDF.'],

function modal(title, html, { wide } = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="mh"><h2>${esc(title)}</h2><button class="btn icon sm" type="button" data-close aria-label="Cerrar">${ic('x')}</button></div><div class="mb">${html}</div></div>`;
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey); document.body.append(ov);
  const first = $('input:not([type=hidden]):not([type=checkbox]):not([type=radio]),select,textarea', ov);
  if (first && window.matchMedia('(min-width:901px)').matches) first.focus();
  ov.close = close; return ov;
}
const closeModals = () => $$('.ov').forEach(o => o.close ? o.close() : o.remove());
function confirmDlg(msg, okLabel = 'Confirmar', danger = true) {
  return new Promise(res => {
    const m = modal('Confirmar', `<p>${esc(msg)}</p><div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okLabel)}</button></div>`);
    let done = false;
    m.addEventListener('click', e => { if (e.target.closest('[data-ok]')) { done = true; m.close(); res(true); } });
    new MutationObserver((_, obs) => { if (!document.body.contains(m)) { obs.disconnect(); if (!done) res(false); } }).observe(document.body, { childList: true });
  });
}
function promptDlg(title, label, okLabel = 'Guardar', { required = false, value = '' } = {}) {
  return new Promise(res => {
    const m = modal(title, `<form><label class="f"><span>${esc(label)}</span><textarea name="t" maxlength="300">${esc(value)}</textarea></label><div class="mf"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">${esc(okLabel)}</button></div></form>`);
    let done = false;
    $('form', m).onsubmit = e => { e.preventDefault(); const v = e.target.t.value.trim(); if (required && !v) return; done = true; m.close(); res(v); };
    new MutationObserver((_, obs) => { if (!document.body.contains(m)) { obs.disconnect(); if (!done) res(null); } }).observe(document.body, { childList: true });
  });
}

const PERIODS = { mes: 'Este mes', prev: 'Mes anterior', trimestre: 'Últimos 3 meses', anio: 'Este año', todo: 'Todo el historial' };
function periodRange(p) {
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  if (p === 'mes') return [new Date(y, m, 1), new Date(y, m + 1, 1)];
  if (p === 'prev') return [new Date(y, m - 1, 1), new Date(y, m, 1)];
  if (p === 'trimestre') return [new Date(y, m - 2, 1), new Date(y, m + 1, 1)];
  if (p === 'anio') return [new Date(y, 0, 1), new Date(y + 1, 0, 1)];
  return [new Date(0), new Date(8.64e15)];
}
const inR = (d, r) => { if (!d) return false; const x = new Date(d); return x >= r[0] && x < r[1]; };
const monthStart = k => new Date(+String(k).slice(0, 4), +String(k).slice(5, 7) - 1, 1);
const monthsBack = n => { const out = [], now = new Date(); for (let i = n - 1; i >= 0; i--) { const s = new Date(now.getFullYear(), now.getMonth() - i, 1); out.push({ r: [s, new Date(s.getFullYear(), s.getMonth() + 1, 1)], label: s.toLocaleDateString('es-CO', { month: 'short' }) }); } return out; };

function sellerStats(uid, r) {
  const mine = S.sales.filter(s => s.seller_id === uid);
  const inRange = mine.filter(s => inR(s.sold_at, r));
  const paid = mine.filter(s => s.kind === 'unica' && s.payment_status === 'pagado' && inR(s.paid_at, r));
  const comV = sum(paid, s => s.seller_commission);
  const pendV = sum(inRange.filter(s => s.kind === 'unica' && s.payment_status !== 'pagado'), s => s.seller_commission);
  const subs = S.subs.filter(x => x.seller_id === uid); const subIds = new Set(subs.map(x => x.id));
  const sp = S.payments.filter(p => subIds.has(p.subscription_id) && inR(monthStart(p.period), r));
  const comS = sum(sp.filter(p => p.status === 'aprobado'), p => S.sm.get(p.subscription_id)?.seller_monthly_commission);
  let pendS = sum(sp.filter(p => p.status === 'en_revision'), p => S.sm.get(p.subscription_id)?.seller_monthly_commission);
  const cs = monthStart(nowKey());
  if (inR(cs, r)) subs.filter(x => x.status === 'activa' && monthStart(x.started_at) <= cs && !S.payments.some(p => p.subscription_id === x.id && String(p.period).slice(0, 7) === nowKey() && p.status !== 'rechazado'))
    .forEach(x => { pendS += Number(x.seller_monthly_commission); });

async function boot(force) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.booted = null; return renderAuth(); }
  if (S.booted === session.user.id && !force) return;
  S.user = session.user; let me;
  try { me = await q(sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle()); }
  catch (e) { renderAuth(); return toast(friendlyError(e), true); }
  if (!me) { await sb.auth.signOut(); S.authMsg = 'Tu cuenta no tiene perfil. Contacta al administrador.'; return renderAuth(); }
  if (S.loginRole && S.loginRole !== me.role && S.justLogged) {
    S.authMsg = `Esa cuenta es de ${me.role}. Elegimos la pestaña correcta: ingresa de nuevo.`; S.loginRole = me.role; S.justLogged = false; S.booted = null;
    await sb.auth.signOut(); return renderAuth('login');
  }
  S.justLogged = false; S.me = me;
  if (me.status !== 'activo') return renderPending();
  S.booted = me.id; $('#root').innerHTML = `<div class="auth"><div class="muted">Cargando tu panel…</div></div>`;
  try { await loadAll(); } catch (e) { toast(friendlyError(e), true); }
  startLive(); renderShell(); navigate();
}

/* ---------- tiempo real ---------- */
function startLive() {
  stopLive(); const soft = debounce(softRefresh, 700);
  try {
    let ch = sb.channel('kv-' + S.me.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => onNewMsg(p.new))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + S.me.id }, () => run(loadNotifs));
    for (const t of ['group_prices', 'payments', 'sales', 'subscriptions', 'profiles', 'payouts']) ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, soft);
    S.rt = ch.subscribe();
  } catch (e) { console.warn('Tiempo real no disponible; se actualiza cada minuto.', e); }
  S.poll = setInterval(() => { run(loadNotifs); if (S.view === 'chat') run(refreshMsgs); }, 20000);
  S.poll2 = setInterval(softRefresh, 60000);
}
function stopLive() { clearInterval(S.poll); clearInterval(S.poll2); if (S.rt && sb) { try { sb.removeChannel(S.rt); } catch (e) { /* ya cerrado */ } } S.rt = null; }

async function softRefresh() {
  if (!S.me || !S.booted) return;
  try {
    const me = await q(sb.from('profiles').select('*').eq('id', S.me.id).maybeSingle());
    if (me && me.status !== 'activo') { S.me = me; return renderPending(); }
    await loadAll(); if (isEditing()) { S.dirty = true; updateBadges(); } else render();
  } catch (e) { /* silencioso: se reintenta */ }
}

sb?.auth.onAuthStateChange((ev, session) => {
  if (ev === 'PASSWORD_RECOVERY' || (S.recovery && session)) { S.recovery = true; setTimeout(renderNewPassword, 0); return; }
  if (ev === 'SIGNED_OUT') { S.booted = null; S.me = null; setTimeout(() => renderAuth(), 0); }
  else if (session && ev === 'SIGNED_IN') { S.justLogged = !S.booted; setTimeout(() => boot(), 0); }
  else if (ev === 'INITIAL_SESSION') { if (session) setTimeout(() => boot(), 0); else renderAuth(); }
});

  <label class="f"><span>Foto o PDF del comprobante</span><input type="file" name="file" accept="image/jpeg,image/png,image/webp,application/pdf" required></label><p class="hint">Máximo 5 MB. Las fotos grandes se reducen solas.</p>
  <label class="f"><span>Nota (opcional)</span><input name="note" maxlength="200" placeholder="Ej. Nequi, referencia 12345"></label><div class="mf"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">${ic('upload')} Enviar</button></div></form>`);
FORMS.receipt = async form => {
  const file = form.file.files[0], note = form.note.value.trim(); if (!file) return ferr(form, 'Selecciona la foto o el PDF del comprobante.');
  if (!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(file.type)) return ferr(form, 'Solo se aceptan imágenes JPG, PNG, WEBP o PDF.');
  let blob = file;
  if (file.type.startsWith('image/') && file.size > 1.2e6) {
    try { const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .82)) || file; } catch { blob = file; }
  }
  if (blob.size > 5 * 1024 * 1024) return ferr(form, 'El archivo supera 5 MB. Sube uno más liviano.');
  const type = blob.type || file.type, ext = type === 'application/pdf' ? 'pdf' : type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : 'jpg';
  const path = `${S.me.group_id}/${S.me.id}/${crypto.randomUUID()}.${ext}`;
  const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: type, upsert: false }); if (up.error) throw up.error;
  const { error } = await sb.rpc('submit_payment', { p_sale: form.dataset.sale || null, p_subscription: form.dataset.sub || null, p_period: form.dataset.sub ? nowKey() + '-01' : null, p_path: path, p_note: note });
  if (error) { await sb.storage.from(BUCKET).remove([path]); throw error; }
  closeModals(); toast('Comprobante enviado. Tu coordinador lo revisará.'); await loadAll(); render();
};
ACT.receipt = async d => {

  try { const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(d.path, 300); if (error) throw error; if (w) w.location = data.signedUrl; else location.href = data.signedUrl; }
  catch (e) { if (w) w.close(); toast(friendlyError(e), true); }
};

const startOfWeek = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; };
const sameDay = (a, b) => dayKey(a) === dayKey(b);
function calEvents() {
  const ev = [];
  S.clients.filter(c => c.next_followup && ['visitado', 'seguimiento'].includes(c.status)).forEach(c => ev.push({ k: 'seg', day: c.next_followup, time: c.followup_time || '', label: c.name, sub: c.business, seller: c.seller_id, id: c.id, overdue: c.next_followup < todayKey() }));
  S.sales.forEach(s => ev.push({ k: 'sale', day: dayKey(s.sold_at), time: '', label: `Venta ${s.ticket}`, sub: cliName(s.client_id), seller: s.seller_id, id: s.id }));
  return ev;
}
const evColor = e => isCoord() ? colorOf(e.seller) : (e.overdue ? '#DC2626' : '#2563EB');
const chipHtml = e => e.k === 'sale'
  ? `<span class="chip sale" role="button" tabindex="0" data-act="sale" data-id="${e.id}" title="${esc(e.label)}">${esc(e.label)}</span>`
  : `<span class="chip" style="--c:${evColor(e)};--t:${textOn(evColor(e))}" role="button" tabindex="0" data-act="client" data-id="${e.id}" title="${esc(e.label)}">${e.time ? esc(String(e.time).slice(0, 5)) + ' ' : ''}${esc(e.label)}</span>`;
const evCard = e => e.k === 'sale'
  ? `<button class="appt sale" style="--c:#59A31B" data-act="sale" data-id="${e.id}"><span class="t">Venta</span><span><b>${esc(e.sub)}</b><br><span class="small muted">${esc(e.label)} · ${esc(pname(e.seller))}</span></span>${ic('right')}</button>`
  : `<button class="appt" style="--c:${evColor(e)}" data-act="client" data-id="${e.id}"><span class="t">${esc(fHour(e.time) || 'Todo el día')}</span><span><b>${esc(e.label)}</b>${e.overdue ? ' <span class="pill red">Vencido</span>' : ''}<br><span class="small muted">${esc(e.sub || '')}${isCoord() ? ' · ' + esc(pname(e.seller)) : ''}</span></span>${ic('right')}</button>`;

VIEWS.agenda = el => {
  const evs = calEvents(), mode = S.cal.mode, d = S.cal.date; const byDay = day => evs.filter(e => e.day === dayKey(day));
  let ttl = '', body = '';
  if (mode === 'mes') {
    ttl = d.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' }); const start = startOfWeek(new Date(d.getFullYear(), d.getMonth(), 1));
    let h = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(x => `<div class="dow">${x}</div>`).join('');
    for (let i = 0; i < 42; i++) { const day = new Date(start); day.setDate(start.getDate() + i); const items = byDay(day);
      h += `<div class="day ${day.getMonth() !== d.getMonth() ? 'out' : ''} ${sameDay(day, new Date()) ? 'today' : ''} ${items.some(x => x.k === 'sale') ? 'has-sale' : ''}" role="button" tabindex="0" data-act="calDay" data-date="${dayKey(day)}"><span class="n">${day.getDate()}</span>${items.slice(0, 3).map(chipHtml).join('')}${items.length > 3 ? `<span class="more">+${items.length - 3} más</span>` : ''}</div>`; }
    body = `<div class="cal">${h}</div>`;
  } else if (mode === 'semana') {
    const start = startOfWeek(d), end = new Date(start); end.setDate(end.getDate() + 6);
    ttl = `${start.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' })} – ${end.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' })}`; let h = '';
    for (let i = 0; i < 7; i++) { const day = new Date(start); day.setDate(start.getDate() + i);
      h += `<div class="day ${sameDay(day, new Date()) ? 'today' : ''}" role="button" tabindex="0" data-act="calDay" data-date="${dayKey(day)}"><span class="small muted cap"><b>${day.toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric' })}</b></span>${byDay(day).map(chipHtml).join('') || '<span class="more">Libre</span>'}</div>`; }
    body = `<div class="cal week">${h}</div>`;
  } else if (mode === 'dia') {
    ttl = d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }); const items = byDay(d).sort((a, b) => String(a.time).localeCompare(String(b.time)));
    body = items.length ? `<div class="dayview">${items.map(evCard).join('')}</div>` : '<div class="card empty">No hay nada programado este día.</div>';
  } else {
    const up = evs.filter(e => e.k === 'seg').sort((a, b) => (a.day + a.time).localeCompare(b.day + b.time)); ttl = `Seguimientos · ${up.length}`;
    body = up.length ? `<div class="dayview">${up.map(e => `<div class="dayhead" style="margin:6px 0 0">${esc(fDay(e.day))}</div>${evCard(e)}`).join('')}</div>` : '<div class="card empty">No hay seguimientos programados. Agenda uno desde la ficha de un cliente.</div>';
  }
  const legend = isCoord() ? `<div class="legend">${members().filter(m => m.status === 'activo').map(m => `<span><i class="dot" style="--c:${colorOf(m.id)}"></i>${esc(m.username)}</span>`).join('')}<span><i class="dot" style="--c:#B8E26B"></i>Venta</span></div>`
    : `<div class="legend"><span><i class="dot" style="--c:#2563EB"></i>Seguimiento</span><span><i class="dot" style="--c:#DC2626"></i>Vencido</span><span><i class="dot" style="--c:#B8E26B"></i>Venta</span></div>`;
  el.innerHTML = `<div class="pagehead"><div class="grow"><h2>${isCoord() ? 'Agendas del equipo' : 'Mi agenda'}</h2><div class="small muted">Seguimientos programados y ventas cerradas</div></div>${isCoord() ? '' : `<button class="btn primary desk-only" data-act="schedule">${ic('plus')} Programar seguimiento</button>`}</div>
    <div class="calhead"><button class="btn icon sm" data-act="calNav" data-d="-1" aria-label="Anterior">${ic('left')}</button><button class="btn sm" data-act="calToday">Hoy</button><button class="btn icon sm" data-act="calNav" data-d="1" aria-label="Siguiente">${ic('right')}</button><span class="ttl">${esc(ttl)}</span>
      <div class="seg" role="group" aria-label="Vista">${[['mes', 'Mes'], ['semana', 'Semana'], ['dia', 'Día'], ['lista', 'Lista']].map(([k, l]) => `<button class="${mode === k ? 'on' : ''}" data-act="calMode" data-v="${k}">${l}</button>`).join('')}</div></div>${legend}${body}`;
};

const qItems = () => S.catalog.filter(p => priceOf(p.id));
function qCalc() {
  const lines = []; let once = 0, monthly = 0, cOnce = 0, cMonth = 0;
  for (const p of qItems()) { const n = S.qt.items[p.id] || 0; if (!n) continue; const pr = priceOf(p.id), tot = n * pr.sale_price;
    lines.push({ id: p.id, name: p.name, n, unit: pr.sale_price, total: tot, monthly: p.kind === 'mensualidad' });
    if (p.kind === 'mensualidad') { monthly += tot; cMonth += n * pr.seller_commission; } else { once += tot; cOnce += n * pr.seller_commission; } }
  return { lines, once, monthly, first: once + monthly, cOnce, cMonth };
}
const qClientName = () => S.qt.clientId ? cliName(S.qt.clientId) : S.qt.clientName.trim();

      <tr class="final"><th>Primer pago</th><td>${money(c.first)}</td></tr></tbody></table>` : '<div class="empty">Elige productos para armar la cotización.</div>'}</div>`;
}

const threadKey = m => m.recipient_id === null ? 'grupo' : (m.sender_id === S.me.id ? m.recipient_id : m.sender_id);
const readAt = k => { const r = S.reads.find(x => x.thread === k); return r ? new Date(r.last_read_at) : new Date(0); };
const unreadIn = k => S.messages.filter(m => m.sender_id !== S.me.id && threadKey(m) === k && new Date(m.created_at) > readAt(k)).length;
const unreadChats = () => S.messages.filter(m => m.sender_id !== S.me.id && new Date(m.created_at) > readAt(threadKey(m))).length;
const msgsOf = k => S.messages.filter(m => threadKey(m) === k);
function convs() {
  const base = [{ key: 'grupo', name: S.group?.name || 'Grupo', sub: 'Todo el equipo', grp: true }];
  const peers = isCoord() ? activeSellers() : [coordP()].filter(Boolean);
  return base.concat(peers.map(p => ({ key: p.id, name: p.username, sub: isCoord() ? 'Vendedor' : 'Coordinador', id: p.id }))).map(c => { const l = msgsOf(c.key).slice(-1)[0]; return { ...c, last: l, unread: unreadIn(c.key) }; })
    .sort((a, b) => (b.last ? +new Date(b.last.created_at) : 0) - (a.last ? +new Date(a.last.created_at) : 0));
}
const convAv = c => c.grp ? `<span class="av grp">${ic('users')}</span>` : avatar(c.name, c.id);
function chatList() {
  const t = (S.chat.q || '').trim().toLowerCase(); const list = convs().filter(c => !t || c.name.toLowerCase().includes(t));
  return list.length ? list.map(c => `<button class="citem ${c.key === S.chat.peer ? 'on' : ''}" data-act="peer" data-id="${c.key}">${convAv(c)}<span class="meta"><span class="nm"><span>${esc(c.name)}</span><span class="small muted">${c.last ? fTime(c.last.created_at) : ''}</span></span>
    <span class="pv"><span class="tx">${c.last ? (c.last.sender_id === S.me.id ? 'Tú: ' : (c.key === 'grupo' ? esc(pname(c.last.sender_id)) + ': ' : '')) + esc(c.last.body) : esc(c.sub)}</span>${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</span></span></button>`).join('') : '<div class="empty">Sin conversaciones.</div>';
}
function msgsHtml() {
  const list = msgsOf(S.chat.peer); if (!list.length) return '<div class="cempty">Aún no hay mensajes. Escribe el primero.</div>';
  let out = '', last = '';
  const label = d => { const k = dayKey(d); if (k === todayKey()) return 'Hoy'; const y = new Date(); y.setDate(y.getDate() - 1); if (k === dayKey(y)) return 'Ayer'; return fDate(d); };
  for (const m of list) { const k = dayKey(m.created_at); if (k !== last) { out += `<div class="day-sep">${label(m.created_at)}</div>`; last = k; }
    const me = m.sender_id === S.me.id; out += `<div class="bub ${me ? 'me' : ''}">${!me && S.chat.peer === 'grupo' ? `<div class="who" style="color:${colorOf(m.sender_id)}">${esc(pname(m.sender_id))}</div>` : ''}${esc(m.body)}<div class="tm">${fTime(m.created_at)}</div></div>`; }
  return out;
}
function chatPane() {

function repaintChat(keepList) { const m = $('#cmsgs'); if (m) { const atEnd = m.scrollHeight - m.scrollTop - m.clientHeight < 80; m.innerHTML = msgsHtml(); if (atEnd) m.scrollTop = m.scrollHeight; } const l = $('#citems'); if (l) l.innerHTML = chatList(); }
async function markRead(key) {
  if (!unreadIn(key)) return; const now = new Date().toISOString(), r = S.reads.find(x => x.thread === key);
  if (r) r.last_read_at = now; else S.reads.push({ user_id: S.me.id, thread: key, last_read_at: now }); updateBadges();

VIEWS.perfil = el => {
  const co = coordP(), me = S.me;
  el.innerHTML = `<div class="pagehead"><div class="grow"><h2>Mi perfil</h2></div></div>
    <div class="grid cols2"><div class="card"><div class="emp-head">${avatar(me.username, me.id, 'lg')}<div><b style="font-size:17px">${esc(me.username)}</b><div class="small muted cap">${me.role}</div><div class="small muted">${esc(me.email)}</div></div></div>
      <form data-form="profile" novalidate><div data-ferr></div><label class="f"><span>Nombre de usuario</span><input name="username" value="${esc(me.username)}" maxlength="30" required></label><label class="f"><span>WhatsApp</span><input name="whatsapp" type="tel" inputmode="tel" value="${esc(me.whatsapp)}" required></label><button class="btn primary" type="submit">Guardar cambios</button></form></div>
      <div class="card"><h2>Mi grupo</h2><div class="statrow"><span>Grupo</span><b style="font-family:var(--font)">${esc(S.group?.name || '')}</b></div>${isCoord() ? `<div class="statrow"><span>Código</span><span class="code">${esc(S.group?.code || '')}</span></div>` : (co ? `<div class="statrow"><span>Coordinador</span><b style="font-family:var(--font)">${esc(co.username)}</b></div><a class="btn" style="margin-top:10px" target="_blank" rel="noopener" href="${esc(waLink(co.whatsapp))}">${ic('phone')} Escribirle por WhatsApp</a>` : '')}</div>
      <div class="card"><h2>Cambiar contraseña</h2><form data-form="password" novalidate><div data-ferr></div>${pwdField('Nueva contraseña (mínimo 8 caracteres)', 'p1', 'new-password')}${pwdField('Repite la contraseña', 'p2', 'new-password')}<button class="btn primary" type="submit">${ic('lock')} Actualizar contraseña</button></form></div>
      <div class="card"><h2>Cuenta</h2><div class="actions"><button class="btn" data-act="terms">Tratamiento de datos personales</button><button class="btn danger" data-act="logout">${ic('logout')} Cerrar sesión</button></div></div></div>`;
};
FORMS.profile = async form => {
  const f = new FormData(form), username = String(f.get('username')).trim(), whatsapp = digits(f.get('whatsapp'));
  if (username.length < 3) return ferr(form, 'El nombre de usuario debe tener al menos 3 caracteres.'); if (whatsapp.length < 7) return ferr(form, 'WhatsApp inválido.');
  await q(sb.from('profiles').update({ username, whatsapp }).eq('id', S.me.id)); toast('Perfil actualizado'); await loadAll(); render();
};
FORMS.password = async form => {
  const f = new FormData(form), p1 = String(f.get('p1')), p2 = String(f.get('p2')); if (p1.length < 8) return ferr(form, 'La contraseña debe tener al menos 8 caracteres.'); if (p1 !== p2) return ferr(form, 'Las contraseñas no coinciden.');
  const { error } = await sb.auth.updateUser({ password: p1 }); if (error) throw error; form.reset(); toast('Contraseña actualizada');
};

/* =====================================================================
   Acciones generales
   ===================================================================== */
ACT.go = d => go(d.v);
ACT.more = () => openMore();
ACT.logout = async () => { S.booted = null; closeModals(); await sb.auth.signOut(); };
ACT.recheck = () => boot(true);
ACT.terms = () => modal('Tratamiento de datos', TERMS_HTML);
ACT.authTab = d => { S.authMsg = ''; renderAuth(d.v); };
ACT.loginRole = d => { S.loginRole = d.v; S.authMsg = ''; renderAuth('login'); };
ACT.signRole = d => { S.signRole = d.v; renderAuth('signup'); };
ACT.showpwd = (d, btn) => { const i = $('input', btn.closest('.pwd')); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; btn.textContent = show ? 'Ocultar' : 'Mostrar'; };

/* ---------- inicio ---------- */
(function start() {
  if (!sb) { $('#root').innerHTML = `<div class="auth"><div class="auth-card"><h2>Sin conexión</h2><p class="muted">No se pudo cargar el sistema. Revisa tu internet y recarga la página.</p><button class="btn primary" onclick="location.reload()">Recargar</button></div></div>`; return; }
  if (S.recovery) setTimeout(() => { if (!S.booted) renderNewPassword(); }, 1500);
})();

</script>
</body>
</html>
